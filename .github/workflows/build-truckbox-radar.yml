name: Compilar TruckBox Radar Android
on:
  push:
    branches: [main]
    paths:
      - 'truckbox-radar-source.b64'
      - '.github/workflows/build-truckbox-radar.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar projeto Android
        run: |
          base64 --decode truckbox-radar-source.b64 > truckbox-source.zip
          unzip -q truckbox-source.zip
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android API 35 sem pacote legado
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK experimental
        working-directory: TruckBox_Radar_Android
        run: gradle :app:assembleDebug --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckBox-Radar-Android-APK
          path: TruckBox_Radar_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
